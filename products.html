<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Gomez Garage Studio</title>
<meta name="description" content="Browse desk, display and automotive parts designed from scratch and 3D-printed in-house by Gomez Garage Studio.">
<link rel="canonical" href="https://gomezgarage.eu/studio/products.html">
<meta property="og:title" content="Products — Gomez Garage Studio">
<meta property="og:description" content="Browse desk, display and automotive parts designed from scratch and 3D-printed in-house.">
<meta property="og:image" content="https://gomezgarage.eu/studio/assets/images/hero-bg.svg">
<meta property="og:url" content="https://gomezgarage.eu/studio/products.html">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/studio/assets/images/favicon.svg">
<link rel="stylesheet" href="/studio/assets/css/main.css">
<link rel="stylesheet" href="/studio/assets/css/shop.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-inner">
    <a href="/studio/index.html" class="nav-logo">
      <img src="/studio/assets/images/logo-gomez.svg" alt="Gomez Garage">
    </a>
    <nav class="nav-links">
      <a href="/studio/products.html" class="active" data-en="Products" data-ro="Produse">Products</a>
      <a href="/studio/custom.html" data-en="Custom Order" data-ro="Comanda Custom">Custom Order</a>
      <a href="/studio/about.html" data-en="About" data-ro="Despre">About</a>
    </nav>
    <div class="nav-actions">
      <div class="nav-toggle" data-lang-toggle>
        <button data-lang-btn="en" class="active">EN</button>
        <button data-lang-btn="ro">RO</button>
      </div>
      <div class="nav-toggle" data-currency-toggle>
        <button data-currency-btn="EUR" class="active">EUR</button>
        <button data-currency-btn="RON">RON</button>
      </div>
      <a href="/studio/cart.html" class="cart-icon-link" aria-label="Cart">
        🛒<span class="cart-count hidden" data-cart-count>0</span>
      </a>
      <button class="nav-burger" data-nav-burger aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="section-label mono" data-en="Shop" data-ro="Magazin">Shop</span>
      <h1 data-en="Products" data-ro="Produse">Products</h1>
    </div>
  </section>

  <section style="padding-top:48px;">
    <div class="container">
      <div class="shop-toolbar">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter-btn="all" data-en="All" data-ro="Toate">All</button>
          <button class="filter-btn" data-filter-btn="desk" data-en="Desk" data-ro="Birou">Desk</button>
          <button class="filter-btn" data-filter-btn="display" data-en="Display" data-ro="Expunere">Display</button>
          <button class="filter-btn" data-filter-btn="automotive" data-en="Automotive" data-ro="Auto">Automotive</button>
        </div>
        <select class="sort-select" data-sort-select>
          <option value="newest" data-en="Newest" data-ro="Cele mai noi">Newest</option>
          <option value="price-asc" data-en="Price: Low to High" data-ro="Pret: crescator">Price: Low to High</option>
          <option value="price-desc" data-en="Price: High to Low" data-ro="Pret: descrescator">Price: High to Low</option>
        </select>
      </div>

      <div class="product-grid" data-products-grid>
        <p class="empty-state" data-en="Loading products…" data-ro="Se incarca produsele…">Loading products…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <div class="nav-logo"><img src="/studio/assets/images/logo-gomez.svg" alt="Gomez Garage"></div>
        <p data-en="Precision made. Built to last." data-ro="Precizie. Facut sa dureze.">Precision made. Built to last.</p>
      </div>
      <div class="footer-cols">
        <div class="footer-col">
          <h5 data-en="Shop" data-ro="Magazin">Shop</h5>
          <a href="/studio/products.html" data-en="Products" data-ro="Produse">Products</a>
          <a href="/studio/custom.html" data-en="Custom Order" data-ro="Comanda Custom">Custom Order</a>
          <a href="/studio/about.html" data-en="About" data-ro="Despre">About</a>
        </div>
        <div class="footer-col">
          <h5 data-en="Contact" data-ro="Contact">Contact</h5>
          <p>contact@gomezgarage.eu</p>
        </div>
        <div class="footer-col">
          <h5 data-en="Follow" data-ro="Urmareste">Follow</h5>
          <div class="social-links">
            <a href="https://instagram.com" aria-label="Instagram" target="_blank" rel="noopener">Instagram</a>
            <a href="https://tiktok.com" aria-label="TikTok" target="_blank" rel="noopener">TikTok</a>
            <a href="https://youtube.com" aria-label="YouTube" target="_blank" rel="noopener">YouTube</a>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 Lancer Land SRL · gomezgarage.eu</span>
      <span class="mono">GOMEZ GARAGE STUDIO</span>
    </div>
  </div>
</footer>

<script src="/studio/assets/js/currency.js"></script>
<script src="/studio/assets/js/shop.js"></script>
<script src="/studio/assets/js/main.js"></script>
</body>
</html>
