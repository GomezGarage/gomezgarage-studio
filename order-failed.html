<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Failed — Gomez Garage Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/studio/assets/images/favicon.svg">
<link rel="stylesheet" href="/studio/assets/css/main.css">
<link rel="stylesheet" href="/studio/assets/css/shop.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-inner">
    <a href="/studio/index.html" class="nav-logo">
      <img src="/studio/assets/images/logo-gomez.svg" alt="Gomez Garage">
    </a>
    <nav class="nav-links">
      <a href="/studio/products.html" data-en="Products" data-ro="Produse">Products</a>
      <a href="/studio/custom.html" data-en="Custom Order" data-ro="Comanda Custom">Custom Order</a>
      <a href="/studio/about.html" data-en="About" data-ro="Despre">About</a>
    </nav>
    <div class="nav-actions">
      <div class="nav-toggle" data-lang-toggle>
        <button data-lang-btn="en" class="active">EN</button>
        <button data-lang-btn="ro">RO</button>
      </div>
      <a href="/studio/cart.html" class="cart-icon-link" aria-label="Cart">
        🛒<span class="cart-count hidden" data-cart-count>0</span>
      </a>
    </div>
  </div>
</header>

<main>
  <div class="container status-page">
    <div>
      <div class="status-icon failed">✕</div>
      <h1 data-en="Payment failed" data-ro="Plata a esuat">Payment failed</h1>
      <p data-en="Something went wrong processing your payment. Your cart has been saved — no charge was made." data-ro="Ceva nu a mers bine la procesarea platii. Cosul tau a fost salvat — nu s-a efectuat nicio taxare.">Something went wrong processing your payment. Your cart has been saved — no charge was made.</p>
      <div class="order-number mono" data-order-number></div>
      <a href="/studio/checkout.html" class="btn btn-primary" data-en="Try again" data-ro="Incearca din nou">Try again</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Lancer Land SRL · gomezgarage.eu</span>
      <span class="mono">GOMEZ GARAGE STUDIO</span>
    </div>
  </div>
</footer>

<script src="/studio/assets/js/currency.js"></script>
<script src="/studio/assets/js/shop.js"></script>
<script src="/studio/assets/js/main.js"></script>
<script>
  var orderNumber = new URLSearchParams(window.location.search).get('order');
  if (orderNumber) {
    document.querySelector('[data-order-number]').textContent = 'Order #' + orderNumber;
  }
</script>
</body>
</html>
